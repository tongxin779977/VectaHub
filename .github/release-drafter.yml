name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-resolver:
  major:
    labels: ['breaking', 'major']
  minor:
    labels: ['feature', 'enhancement']
  patch:
    labels: ['bug', 'fix', 'chore', 'docs', 'dependencies']
  default: patch
include-pre-release: true
pre-release-label: 'prerelease'
categories:
  - title: '🚀 Breaking Changes'
    labels: ['breaking']
  - title: '✨ New Features'
    labels: ['feature', 'enhancement']
  - title: '🐛 Bug Fixes'
    labels: ['bug', 'fix']
  - title: '⚡ Performance'
    labels: ['performance', 'perf']
  - title: '🔧 Maintenance'
    labels: ['chore', 'dependencies', 'refactor']
  - title: '📚 Documentation'
    labels: ['docs', 'documentation']
  - title: '🔒 Security'
    labels: ['security']
  - title: 'Other Changes'
    labels: ['*']
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
exclude-labels: ['skip-changelog', 'duplicate', 'invalid']