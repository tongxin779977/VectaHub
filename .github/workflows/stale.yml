name: Stale Bot

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale issues and PRs
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            If this is still relevant, please open a new issue or add a comment
            to reopen the discussion.
          exempt-issue-labels: 'bug,security,enhancement,priority:high,priority:critical,pinned'
          operations: 'issues'
          schedule: '0 2 * * *'

      - name: Mark stale PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 14
          days-before-close: 7
          stale-pr-label: 'stale'
          close-pr-message: |
            This PR has been automatically closed due to inactivity.
            Please reopen if you'd like to continue working on it.
          exempt-pr-labels: 'pinned,do-not-close,WIP,breaking'
          operations: 'pulls'
          schedule: '0 2 * * *'