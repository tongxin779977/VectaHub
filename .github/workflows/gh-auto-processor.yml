name: VectaHub Self-Healing CI
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: vh-gh-processor
  cancel-in-progress: false

jobs:
  healing:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install & Build VectaHub
        run: |
          npm ci
          npm run build

      - name: Process Failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VECTAHUB_HOME: ${{ github.workspace }}/.vectahub
        run: |
          RUN_ID=${{ github.event.workflow_run.id }}
          echo "Healing triggered for Run: $RUN_ID"
          
          # 直接使用 VectaHub 运行加固后的处理模板
          node dist/cli.js run -f templates/gh-auto-process.yaml \
            --variable run_id=$RUN_ID \
            --mode relaxed
