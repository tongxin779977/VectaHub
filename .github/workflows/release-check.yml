name: Release Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - tsup.config.ts
      - .github/workflows/release-check.yml
      - packages/vectahub-vscode-extension/**

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check default context usage
        run: npm run check:default-context-usage

      - name: Test
        run: npm exec -- vitest --run --exclude '**/packages/vectahub-vscode-extension/**'

      - name: Build
        run: npm run build

      - name: Smoke test built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js version --json

      - name: Compile extension
        run: npm run compile -w packages/vectahub-vscode-extension

      - name: Lint extension
        run: npm run lint -w packages/vectahub-vscode-extension

      - name: Test extension
        run: npm test -w packages/vectahub-vscode-extension

      - name: Package VSIX
        run: npm run package:vsix

      - name: Verify release artifacts
        run: |
          test -f dist/cli.js
          find packages/vectahub-vscode-extension -maxdepth 1 -name '*.vsix' -type f | grep -q .

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: vectahub-dist
          path: dist/**

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vectahub-vsix
          path: packages/vectahub-vscode-extension/*.vsix

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-failure-diagnostics
          path: |
            .test-reports/**
            logs/**
            fail_*.log
            packages/vectahub-vscode-extension/.vscode-test/**
          if-no-files-found: ignore
