name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check default context usage
        run: npm run check:default-context-usage

      - name: Check documentation links
        run: npm run check:docs

      - name: Test
        run: npm exec -- vitest --run --exclude '**/packages/vectahub-vscode-extension/**'

      - name: Build
        run: npm run build

      - name: Smoke test built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js version --json

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: root-failure-diagnostics
          path: |
            .test-reports/**
            logs/**
            fail_*.log
          if-no-files-found: ignore

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile -w packages/vectahub-vscode-extension

      - name: Lint extension
        run: npm run lint -w packages/vectahub-vscode-extension

      - name: Test extension
        run: npm test -w packages/vectahub-vscode-extension

      - name: Upload extension failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-failure-diagnostics
          path: |
            packages/vectahub-vscode-extension/.vscode-test/**
            packages/vectahub-vscode-extension/out/**
          if-no-files-found: ignore
