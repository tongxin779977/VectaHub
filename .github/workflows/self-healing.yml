name: VectaHub Self-Healing CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: self-healing-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  healing:
    name: Diagnose failed CI run
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build VectaHub
        run: |
          npm ci
          npm run build

      - name: Process CI failure
        env:
          GH_TOKEN: ${{ github.token }}
          VECTAHUB_HOME: ${{ github.workspace }}/.vectahub
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          echo "## VectaHub Self-Healing CI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Diagnosing failed CI run: $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          node dist/cli.js run -f templates/gh-auto-process.yaml \
            --variable run_id="$RUN_ID" \
            --mode relaxed 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload self-healing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-healing-diagnostics
          path: |
            .vectahub/**
            logs/**
          if-no-files-found: ignore
