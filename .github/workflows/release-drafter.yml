name: Release Drafter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  update_release_draft:
    name: Draft next release notes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update release draft
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  classify_pr:
    name: Apply area labels from PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply labels from PR title
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || '';
            const body = context.payload.pull_request.body || '';
            const labels = new Set();

            const conventionalRe = /^(?<type>feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(?:\((?<scope>[^)]+)\))?!?:/i;
            const m = title.match(conventionalRe);
            if (m) {
              const type = m.groups.type.toLowerCase();
              labels.add(type === 'feat' ? 'feature' : type);
              if (type === 'feat') labels.add('enhancement');
              if (m.groups.scope) labels.add(`scope:${m.groups.scope.toLowerCase()}`);
              if (title.includes('!')) labels.add('breaking');
            }

            const areas = {
              'vscode-extension': ['vscode', 'extension'],
              'area:agent': ['agent'],
              'area:workflow': ['workflow'],
              'area:provider': ['provider'],
              'area:template': ['template'],
              'area:nl': ['nl', 'natural language'],
            };
            const lower = (title + ' ' + body).toLowerCase();
            for (const [label, kws] of Object.entries(areas)) {
              if (kws.some((k) => lower.includes(k))) labels.add(label);
            }

            if (body.toLowerCase().includes('breaking change')) labels.add('breaking');

            if (labels.size === 0) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [...labels],
            });