name: Hourly GitHub Actions Issue & Warning Processor

on:
  schedule:
    - cron: '0 * * * *' # 每小时整点执行
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write
  security-events: read
  issues: write
  actions: write

jobs:
  security-monitor:
    name: Check Security Vulnerabilities & Actions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci && npm run build

      - name: Check npm audit
        id: npm-audit
        run: |
          echo "## NPM Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if npm audit --audit-level=moderate --json > audit-results.json; then
            echo "✅ No security vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            echo "vulnerable=false" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Found vulnerabilities!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat audit-results.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "vulnerable=true" >> $GITHUB_OUTPUT
          fi

      - name: Check Dependabot alerts
        id: dependabot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALERT_COUNT=$(gh api repos/${{ github.repository }}/dependabot/alerts?state=open --jq 'length' 2>/dev/null || echo "0")
          echo "alertCount=$ALERT_COUNT" >> $GITHUB_OUTPUT
          
          echo "## Dependabot Alerts" >> $GITHUB_STEP_SUMMARY
          if [ "$ALERT_COUNT" = "0" ]; then
            echo "✅ No open Dependabot alerts!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Found $ALERT_COUNT open Dependabot alerts" >> $GITHUB_STEP_SUMMARY
            gh api repos/${{ github.repository }}/dependabot/alerts?state=open --jq '.[] | "- " + .security_advisory.summary + " (" + .security_advisory.severity + ")"' 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Check recent workflow runs
        id: workflow-status
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20,
              status: 'completed'
            });

            const failedRuns = runs.workflow_runs.filter(r => r.conclusion === 'failure');
            
            let summary = '\n## Recent Workflow Runs\n';
            summary += `Total recent runs: ${runs.workflow_runs.length}\n`;
            summary += `Failed runs: ${failedRuns.length}\n\n`;
            
            if (failedRuns.length > 0) {
              summary += '⚠️ Failed workflows:\n';
              for (const run of failedRuns.slice(0, 5)) {
                summary += `- [${run.name}](${run.html_url}) - ${new Date(run.created_at).toLocaleString()}\n`;
              }
            }
            
            await core.summary.addRaw(summary).write();
            core.setOutput('failedRuns', failedRuns.length);

      - name: Auto-retry failed workflows
        id: auto-retry
        if: steps.workflow-status.outputs.failedRuns > 0
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10,
              status: 'completed'
            });

            const failedRuns = runs.workflow_runs.filter(r => r.conclusion === 'failure');
            const retryResults = [];

            for (const run of failedRuns.slice(0, 3)) {
              try {
                await github.rest.actions.reRunWorkflowFailedJobs({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                retryResults.push({ id: run.id, name: run.name, status: 'retried' });
                console.log(`Retried failed run: ${run.name} (${run.id})`);
              } catch (error) {
                retryResults.push({ id: run.id, name: run.name, status: 'failed-to-retry', error: error.message });
                console.error(`Failed to retry run ${run.id}:`, error.message);
              }
            }

            core.setOutput('retryResults', JSON.stringify(retryResults));

      - name: Process issues with VectaHub
        id: vectahub-process
        if: steps.workflow-status.outputs.failedRuns > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VECTAHUB_HOME: ${{ github.workspace }}/.vectahub
        run: |
          echo "## Processing with VectaHub" >> $GITHUB_STEP_SUMMARY
          
          # 调用 VectaHub 批量处理失败的运行
          if [ -f "templates/gh-auto-process-all.yaml" ]; then
            node dist/cli.js run -f templates/gh-auto-process-all.yaml --mode relaxed 2>&1 | tee -a $GITHUB_STEP_SUMMARY
            echo "processed=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ VectaHub template not found" >> $GITHUB_STEP_SUMMARY
            echo "processed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Issue if problems found
        if: steps.npm-audit.outputs.vulnerable == 'true' || steps.dependabot.outputs.alertCount > 0 || steps.workflow-status.outputs.failedRuns > 0
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔔 GitHub Actions Alert: Issues Detected';
            
            const retryResults = ${{ steps.auto-retry.outputs.retryResults || '[]' }};
            
            let body = '## Hourly GitHub Actions Issue & Warning Processor Report\n\n';
            body += '### Security Status\n';
            body += `- NPM Audit Vulnerabilities: ${steps.npm-audit.outputs.vulnerable == 'true' ? '⚠️ Found' : '✅ Clear'}\n`;
            body += `- Dependabot Alerts: ${steps.dependabot.outputs.alertCount} open\n\n`;
            
            body += '### Workflow Status\n';
            body += `- Failed Workflows: ${steps.workflow-status.outputs.failedRuns}\n`;
            
            if (retryResults.length > 0) {
              body += '- Auto-retry attempts:\n';
              for (const result of retryResults) {
                body += `  - ${result.name} (ID: ${result.id}): ${result.status}\n`;
              }
            }
            
            body += '\n### Actions Taken\n';
            if (steps.vectahub-process.outputs.processed == 'true') {
              body += '- ✅ VectaHub analysis completed\n';
            }
            if (retryResults.length > 0) {
              body += '- 🔄 Auto-retry attempted for failed workflows\n';
            }
            
            body += '\n---\n';
            body += 'This issue was automatically created by the hourly GitHub Actions processor workflow.\n';
            body += 'Please review the details and take appropriate action if needed.\n';
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['automation', 'github-actions', 'monitoring']
            });

  keep-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep workflow alive
        uses: gautamkrishnar/keepalive-workflow@v2
